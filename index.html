<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>精听练习器</title>

<div id="drawer-backdrop" hidden></div>
<aside class="sidebar" id="sidebar">
 <div class="brand"><svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15"/><path d="M17 27v10M27 20v24M37 15v34M47 24v16"/></svg><div>精听练习器<small>INTENSIVE LISTENING</small></div><button id="nav-fold" class="nav-fold" aria-controls="main-nav" aria-expanded="true"><span>收起菜单</span><svg class="icon"><use href="#i-chevron"/></svg></button></div>
 <nav class="main-nav" id="main-nav" aria-label="功能"><button data-view="home"><svg class="icon"><use href="#i-home"/></svg><span class="nav-label">首页</span></button><button data-view="listen"><svg class="icon"><use href="#i-headphones"/></svg><span class="nav-label">精听练习</span></button><button data-view="review"><svg class="icon"><use href="#i-calendar"/></svg><span class="nav-label">今日复习</span><span class="badge" id="due-nav" hidden>0</span></button><button data-view="mistakes"><svg class="icon"><use href="#i-alert"/></svg><span class="nav-label">错题本</span></button><button data-view="vocab"><svg class="icon"><use href="#i-bookmark"/></svg><span class="nav-label">生词本</span><span class="badge" id="vocab-nav" hidden>0</span></button><button data-view="index"><svg class="icon"><use href="#i-list"/></svg><span class="nav-label">考点索引</span></button><button data-view="stats"><svg class="icon"><use href="#i-chart"/></svg><span class="nav-label">学习统计</span></button><button data-view="library"><svg class="icon"><use href="#i-library"/></svg><span class="nav-label">题库管理</span></button></nav>
 <div class="library-label">题库 <span id="library-count"></span></div><label class="searchbox"><svg class="icon"><use href="#i-search"/></svg><input id="search" placeholder="搜索原文单词" aria-label="搜索原文单词"></label>
 <div id="tree"></div><div id="search-results" hidden></div>
 <div class="sidebar-bottom"><div class="local-state"><span class="local-dot"></span>只保存在本机 · 不上传</div><div class="data-actions"><button data-action="import-new"><svg class="icon"><use href="#i-plus"/></svg>导入新材料</button><button id="backup"><svg class="icon"><use href="#i-download"/></svg>备份学习记录</button><button id="restore"><svg class="icon"><use href="#i-upload"/></svg>恢复学习记录</button></div></div>
</aside>
<div class="workspace">
 <header class="topbar"><button id="menu-toggle" class="icon-button" aria-label="打开题库与菜单" aria-expanded="false"><svg class="icon"><use href="#i-menu"/></svg></button><div id="breadcrumb"></div><div class="preferences"><label class="font-pref">字号 <select id="font-size" aria-label="正文字号"><option>14</option><option selected>16</option><option>18</option><option>20</option></select></label><button id="theme" class="icon-button" title="切换深色主题" aria-label="切换深色主题"><svg class="icon"><use href="#i-moon"/></svg><span>深色</span></button></div></header>
 <div id="storage-alert" class="alert danger" hidden role="alert"></div>
 <main id="main">
  <section id="listen-view" hidden>
   <div class="section-heading"><div class="title-block"><div class="eyebrow" id="section-collection">INTENSIVE LISTENING</div><div class="title-row"><h1 id="section-title"></h1><span id="timing-tag" class="tag muted-tag" hidden>暂不支持逐句定位</span></div></div><div id="section-switch" class="section-switch"></div></div>
   <div class="toolbar"><div class="progress-block"><span id="progress">0 / 0 空</span><div class="progress-track" aria-hidden="true"><div id="progress-fill" class="progress-fill"></div></div></div><div class="toolbar-actions"><button id="weak" class="tool-button" aria-pressed="false"><svg class="icon"><use href="#i-target"/></svg>薄弱段落重练</button><button id="reveal" class="tool-button"><svg class="icon"><use href="#i-eye"/></svg>显示全部答案</button><button id="edit-section" class="tool-button"><svg class="icon"><use href="#i-edit"/></svg>校对时间轴与挖空</button><span class="tool-gap"></span><button id="reset" class="tool-button"><svg class="icon"><use href="#i-rotate"/></svg>重做本节</button></div></div>
   <div class="mode-tabs"><div class="segmented" role="group" aria-label="练习模式"><button id="blind-mode" class="active"><svg class="icon"><use href="#i-headphones"/></svg>盲听</button><button id="full-mode"><svg class="icon"><use href="#i-list"/></svg>挖空练习</button></div><button id="submit" class="primary">提交本节 <kbd class="kbd-on-primary">⌘ / Ctrl ↵</kbd></button></div>
   <div id="player-sentinel" aria-hidden="true"></div>
   <section id="player-panel" class="player-panel" aria-label="音频播放器">
    <div class="player-main"><button id="play" class="play-button" aria-label="播放"><svg class="icon"><use href="#i-play"/></svg></button><div class="seek-area"><div class="player-caption"><strong id="audio-label"></strong><span id="playing-state">准备就绪</span></div><div class="seek-wrap"><input id="seek" type="range" min="0" max="1" value="0" step="0.01" aria-label="音频进度"><span id="seek-tip" hidden>00:00</span></div><div class="time-row"><span id="current-time">00:00</span><span id="duration">--:--</span></div></div></div>
    <div class="player-options"><button id="back5" class="chip" title="回退5秒"><svg class="icon"><use href="#i-rotate"/></svg>5 秒</button><label class="chip speed-chip">语速 <select id="speed" aria-label="播放速度"><option>0.5</option><option>0.6</option><option>0.7</option><option>0.8</option><option>0.9</option><option selected>1.0</option><option>1.1</option><option>1.2</option><option>1.3</option><option>1.4</option><option>1.5</option></select>×</label><div class="divider"></div><div class="ab-group"><button id="set-a" class="chip">A 起点</button><button id="set-b" class="chip">B 终点</button><button id="clear-ab" class="chip chip-clear" hidden aria-label="清除 A–B"><svg class="icon"><use href="#i-x"/></svg>清除</button></div><button id="loop" class="chip" aria-pressed="false"><svg class="icon"><use href="#i-repeat"/></svg>循环本节</button><span class="keyboard-hint"><kbd>空格</kbd> 播放 / 暂停 <kbd>R</kbd> 重播当前段</span></div>
    <div id="audio-alert" class="alert" hidden role="alert"></div>
   </section>
   <div id="pause-tools" hidden><span id="pause-label">句子定位</span><button id="previous-sentence" class="chip">[ 前一句</button><button id="next-sentence" class="chip">后一句 ]</button><span id="pause-metrics"></span></div>
   <div id="practice-heading" class="practice-heading" hidden><h2>按段精听</h2><span class="practice-sub">段落连续显示 · 点击小句号重听单句</span><select id="weak-sort" hidden aria-label="薄弱句排序"><option value="time">按最近出错</option><option value="type">按考点类型</option></select><button id="follow-paragraph" class="chip" aria-pressed="false"><svg class="icon"><use href="#i-follow"/></svg>跟随段落：关</button><button id="locate-paragraph" class="chip"><svg class="icon"><use href="#i-locate"/></svg>定位当前段</button></div>
   <div id="sentences"></div>
  </section>
  <section id="other-view"></section>
 </main>
<button id="float-play" class="play-button float-play" aria-label="播放" title="播放 / 暂停（可拖动）"><svg class="icon"><use href="#i-play"/></svg></button>
 <footer><span class="foot-stat" title="只计算已作答的空">正确率 <strong id="accuracy">—</strong></span><span class="foot-stat">本次错题 <strong id="error-count">0</strong></span></footer>
</div>
<audio id="audio" preload="metadata"></audio><input id="file-input" type="file" hidden>
<dialog id="dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="close-dialog" class="icon-button" aria-label="关闭"><svg class="icon"><use href="#i-x"/></svg></button></div><div id="dialog-body"></div></dialog>
<div id="toast" role="status" hidden></div>
<noscript><p style="padding:40px">需要开启 JavaScript。</p></noscript>
<script src="app/core.js"></script><script src="app/db.js"></script><script src="app/transcript.js"></script><script src="app/blanks.js"></script><script src="app/ai.js"></script><script src="app/pack.js"></script><script src="app/section.js"></script><script src="app/itn.js"></script><script src="app/proofread.js"></script>
<script src="app/app.js"></script><script src="app/library.js"></script>
</body></html>
